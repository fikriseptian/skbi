<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verb to Be Adventure</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS",Verdana,sans-serif;background:linear-gradient(160deg,#7c4dff,#29b6f6 60%,#80deea);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:12px;color:#2b2b4a}
.card{background:#fff;border-radius:26px;width:100%;max-width:520px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.25);text-align:center;position:relative;overflow:hidden}
h1{margin:6px 0;font-size:2rem;color:#6a1b9a}
.sub{color:#666;margin-bottom:14px}
.big{font-size:5rem;margin:8px 0}
.btn{background:#ff9800;color:#fff;border:0;border-radius:40px;padding:14px 34px;font-size:1.2rem;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #e65100;margin:6px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #e65100}
.rules{background:#fff8e1;border-radius:16px;padding:10px 14px;text-align:left;margin:12px 0;font-size:1rem;line-height:1.7}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin-bottom:8px}
.bar{height:12px;background:#e0e0e0;border-radius:10px;overflow:hidden;margin-bottom:10px}
.bar div{height:100%;width:0;background:linear-gradient(90deg,#66bb6a,#fdd835);transition:width .4s}
.pic{font-size:5.5rem;margin:6px 0;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.sentence{font-size:1.7rem;font-weight:bold;line-height:2.4;margin:6px 0 12px}
.blank{display:inline-block;min-width:80px;border-bottom:4px dashed #9e9e9e;color:#2e7d32}
.opts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.opt{border:3px solid #333;background:#fff;border-radius:50px;padding:12px 24px;font-size:1.5rem;font-weight:bold;cursor:pointer;transition:.15s}
.opt:active{transform:scale(.93)}
.opt.ok{background:#66bb6a;border-color:#2e7d32;color:#fff}
.opt.no{background:#ef5350;border-color:#b71c1c;color:#fff;animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg{min-height:58px;margin-top:12px;font-size:1.1rem;font-weight:bold}
.good{color:#2e7d32}.bad{color:#c62828}
.streak{color:#e65100}
.fall{position:fixed;top:-40px;font-size:2rem;pointer-events:none;animation:fall 2.4s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.wrong-list{text-align:left;background:#fce4ec;border-radius:14px;padding:10px 14px;margin:10px 0;font-size:1rem}
.hide{display:none}
.inp{display:block;width:100%;font-size:1.2rem;padding:12px 16px;margin:8px 0;border:3px solid #7c4dff;border-radius:16px;font-family:inherit;background:#fff}
.who{background:#ede7f6;border-radius:14px;padding:6px 12px;font-weight:bold;margin-bottom:8px;font-size:.95rem}
</style>
</head>
<body>
<div class="card">

<div id="start">
  <div class="big">🧙‍♂️📖</div>
  <h1>Verb to Be Adventure</h1>
  <div class="sub">Warnai kata yang benar: <b>am</b>, <b>are</b>, atau <b>is</b>! 🎨</div>
  <div class="rules">
    👦 <b>I</b> → <b>am</b><br>
    🧍 <b>He / She / It</b> → <b>is</b><br>
    👥 <b>We / You / They</b> → <b>are</b>
  </div>
  <input id="pname" class="inp" type="text" maxlength="30" placeholder="✏️ Tulis namamu" autocomplete="off">
  <select id="pclass" class="inp">
    <option value="">🏫 Pilih kelas</option>
    <optgroup label="Kelas 6"><option>6A</option><option>6B</option><option>6C</option></optgroup>
    <optgroup label="Kelas lainnya"><option>Kelas A</option><option>Kelas B</option><option>Kelas C</option><option>Kelas D</option></optgroup>
  </select>
  <div id="err" class="bad" style="min-height:24px;font-weight:bold"></div>
  <button class="btn" onclick="begin()">▶ Mulai Main</button>
</div>

<div id="game" class="hide">
  <div class="who" id="who"></div>
  <div class="top"><span id="qno">Soal 1/25</span><span class="streak" id="streak"></span><span id="score">⭐ 0</span></div>
  <div class="bar"><div id="prog"></div></div>
  <div class="pic" id="pic"></div>
  <div class="sentence" id="sentence"></div>
  <div class="opts" id="opts"></div>
  <div class="msg" id="msg"></div>
  <button class="btn hide" id="next" onclick="nextQ()">Lanjut ➡</button>
</div>

<div id="end" class="hide">
  <div class="big" id="trophy">🏆</div>
  <h1 id="endTitle">Hebat!</h1>
  <div class="who" id="endWho"></div>
  <div class="sub" id="endScore"></div>
  <div id="stars" class="big" style="font-size:3rem"></div>
  <div id="wrongBox"></div>
  <button class="btn" onclick="startGame()">🔄 Main Lagi</button>
</div>

</div>

<script>
const DATA=[
["She","is","a yoga teacher.","🧘‍♀️"],
["I","am","a violinist.","🎻"],
["It","is","a green wall.","🟩"],
["They","are","talented doctors.","👩‍⚕️👨‍⚕️"],
["She","is","a book worm.","🐛📖"],
["It","is","a birthday cake.","🎂"],
["She","is","a smart player.","⚽"],
["He","is","singing.","🎤"],
["I","am","a teacher.","👨‍🏫"],
["It","is","a cat.","🐱"],
["We","are","working.","👷‍♂️👷‍♀️"],
["He","is","a carpenter.","🔨"],
["She","is","beautiful.","💖"],
["I","am","teaching.","📚"],
["You","are","a good student.","🧑‍🎓"],
["We","are","friends.","🤝"],
["He","is","a farmer.","👨‍🌾"],
["They","are","playing football.","🏃‍♂️⚽"],
["I","am","happy.","😊"],
["She","is","a nurse.","👩‍⚕️"],
["It","is","a big elephant.","🐘"],
["You","are","my best friend.","💛"],
["They","are","dancing.","💃🕺"],
["I","am","drawing a picture.","🎨"],
["We","are","singing.","🎶"]
];
const HINT={I:"I → am",He:"He → is",She:"She → is",It:"It → is",We:"We → are",They:"They → are",You:"You → are"};
const PRAISE=["Hebat! 🎉","Keren! 🌟","Benar sekali! 👏","Mantap! 💪","Pintar! 🧠"];
let Q,i,score,streak,tries,wrongs,locked;
const $=id=>document.getElementById(id);
let ac;
function beep(f,d,t="sine",v=.15,delay=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+delay;o.start(s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.stop(s+d)}catch(e){}}
const sOk=()=>{beep(523,.15,"sine",.15,0);beep(659,.15,"sine",.15,.12);beep(784,.25,"sine",.15,.24)};
const sNo=()=>beep(150,.35,"sawtooth",.12);
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
let player={name:"",cls:""};
function begin(){
  const n=$("pname").value.trim(),c=$("pclass").value;
  if(!n){$("err").textContent="Tulis namamu dulu ya 😊";return}
  if(!c){$("err").textContent="Pilih kelasmu dulu ya 🏫";return}
  player={name:n,cls:c};startGame();
}
function startGame(){
  Q=shuffle(DATA);i=0;score=0;streak=0;wrongs=[];
  $("start").classList.add("hide");$("end").classList.add("hide");$("game").classList.remove("hide");
  $("who").textContent=`👤 ${player.name} • ${player.cls}`;
  show();
}
function show(){
  const q=Q[i];tries=0;locked=false;
  $("qno").textContent=`Soal ${i+1}/${Q.length}`;
  $("prog").style.width=(i/Q.length*100)+"%";
  $("score").textContent="⭐ "+score;
  $("streak").textContent=streak>=2?`🔥 x${streak}`:"";
  $("pic").textContent=q[3];
  $("sentence").innerHTML=`${q[0]} <span class="blank" id="blank">&nbsp;</span> ${q[2]}`;
  $("msg").textContent="Ketuk kata yang benar untuk mewarnainya 🎨";$("msg").className="msg";
  $("next").classList.add("hide");
  $("opts").innerHTML="";
  ["am","are","is"].forEach(w=>{
    const b=document.createElement("button");b.className="opt";b.textContent=w;
    b.onclick=()=>pick(b,w);$("opts").appendChild(b);
  });
}
function pick(b,w){
  if(locked)return;
  const q=Q[i];
  if(w===q[1]){
    locked=true;b.classList.add("ok");$("blank").textContent=w;$("blank").style.borderBottomStyle="solid";
    const pts=tries===0?10:5;score+=pts;
    if(tries===0)streak++;else streak=0;
    const bonus=streak>=3?5:0;score+=bonus;
    $("msg").innerHTML=`<span class="good">${PRAISE[Math.floor(Math.random()*PRAISE.length)]} +${pts+bonus}</span>`;
    $("score").textContent="⭐ "+score;
    document.querySelectorAll(".opt").forEach(o=>o.disabled=true);
    sOk();if(streak>=3||i===Q.length-1)confetti(12);
    $("next").textContent=i===Q.length-1?"Lihat Hasil 🏁":"Lanjut ➡";
    $("next").classList.remove("hide");
  }else{
    tries++;streak=0;b.classList.add("no");b.disabled=true;sNo();
    if(!wrongs.find(x=>x===q))wrongs.push(q);
    $("msg").innerHTML=`<span class="bad">Belum tepat 😅 Petunjuk: <b>${HINT[q[0]]||""}</b>. Coba lagi!</span>`;
    $("streak").textContent="";
  }
}
function nextQ(){i++;if(i>=Q.length)finish();else show()}
function finish(){
  $("game").classList.add("hide");$("end").classList.remove("hide");
  const max=Q.length*10;const pct=score/max;
  const st=pct>=.9?3:pct>=.6?2:1;
  $("stars").textContent="⭐".repeat(st)+"☆".repeat(3-st);
  $("trophy").textContent=st===3?"🏆":st===2?"🥈":"🥉";
  $("endTitle").textContent=(st===3?"Luar Biasa, ":st===2?"Bagus Sekali, ":"Ayo Semangat, ")+player.name+"!";
  $("endWho").textContent=`👤 ${player.name} • ${player.cls}`;
  $("endScore").textContent=`Skor kamu: ${score} (soal benar: ${Q.length}/${Q.length})`;
  $("wrongBox").innerHTML=wrongs.length?`<div class="wrong-list"><b>📝 Yuk belajar lagi:</b><br>`+wrongs.map(q=>`• ${q[0]} <b>${q[1]}</b> ${q[2]}`).join("<br>")+`</div>`:`<div class="good" style="font-weight:bold">Tanpa salah sama sekali! 🎊</div>`;
  confetti(30);sOk();
}
function confetti(n){
  const e=["🎉","⭐","🎈","✨","🌟","🎊"];
  for(let k=0;k<n;k++){const s=document.createElement("div");s.className="fall";s.textContent=e[Math.floor(Math.random()*e.length)];
  s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),3500)}
}
</script>
</body>
</html>
